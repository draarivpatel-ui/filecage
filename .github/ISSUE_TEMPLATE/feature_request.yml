name: Feature request
description: Request a format, detector, policy control, documentation improvement, or compatibility improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What upload security problem is not currently covered?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the API, default behavior, failure mode, and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test ideas
      description: List attack, malformed-input, platform, and regression cases.
