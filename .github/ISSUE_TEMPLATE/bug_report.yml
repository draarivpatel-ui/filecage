name: Bug report
description: Report incorrect validation, detection, dimensions, filename, packaging, or CLI behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include minimal code, policy, filename, content type, and a hex fixture when possible.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: filecage version, Node.js version, and operating system
    validations:
      required: true
  - type: dropdown
    id: security_sensitive
    attributes:
      label: Is this exploitable security behavior?
      options:
        - No
        - Yes, so I used private vulnerability reporting instead
    validations:
      required: true
